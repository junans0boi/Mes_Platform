openapi: 3.0.3
info:
  title: Mes Platform API
  version: 0.1.0-draft
  description: |
    프론트엔드·백엔드·DB가 함께 따르는 공유 계약의 단일 원본(CON-01 초안).
    이 파일보다 먼저 독립적으로 구현된 API는 허용하지 않는다. 변경은 이 파일의 PR이 구현보다 먼저다.

    규칙 요약
    - 모든 성공 응답은 `{ data, meta:{ requestId, operationId } }` envelope를 쓴다. 목록은 `data.items`를 가진다.
    - 오류는 Problem Details(`code`, `args`, `errors[]`, `requestId`, `operationId`, `traceId`)를 쓴다.
    - 대용량 목록은 cursor로 조회한다. 페이지 번호 이동과 전체 건수(rowCount)는 제공하지 않는다.
    - `plantId`는 숨겨진 헤더가 아니라 모든 Plant 범위 경로의 명시적 parameter(query)다. 서버는 `allowedPlantIds`와 대조해 최종 검증한다.
    - WorkOrder `status`는 문자열이다. 허용 값과 상태 전이는 BE-06 확정 전까지 계약에 정의하지 않는다.
    - 인증 계약은 임시(provisional)다: access token 발급과 세션 조회만 있고 refresh·logout·cookie는 BE-05 결정 후 CON-02가 추가형으로 확장한다.
    - SignalR 이벤트 계약은 `contracts/realtime-events.md`가 정본이다.
    - `nullable` 필드는 키가 항상 존재하고 값이 null이다. 키를 생략하는 것은 계약 위반이다(그래서 nullable 필드도 `required`에 들어 있다). `required`가 아닌 필드는 선택 입력(요청 parameter)뿐이다.
    - 64비트 정수(`int64`)는 JSON number로 보낸다. 브라우저의 `number`가 정확한 안전 정수 범위는 9007199254740991(2^53-1)이며, 이 계약의 모든 int64 값은 이 범위 안이어야 한다. 서버는 이 상한을 넘는 값을 만들지 않는다(`projectionVersion`은 DB sequence가 상한에서 오류를 내도록 정의한다).
    - 정렬: 정렬 키는 `field`(오름차순) 또는 `-field`(내림차순)이고, 고유 키 tie-breaker는 항상 **주 정렬 키와 같은 방향**이다. 정렬 키가 null일 수 있으면 null은 가장 작은 값으로 취급한다(오름차순이면 맨 앞, 내림차순이면 맨 뒤).
    - 검색은 접두(prefix) 일치만 허용한다. 부분 일치(`%q%`)는 제공하지 않는다.
servers:
  - url: /
tags:
  - name: auth
    description: 임시(provisional) 인증 계약
  - name: production
    description: 생산(작업지시) 조회
  - name: monitoring
    description: 실시간 공정 현황(Projection) 조회
security:
  - bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 로그인하고 access token을 받는다 (임시 계약)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: access token 발급. refresh token과 cookie는 이 계약에 없다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: 현재 사용자, 허용 Plant, capability를 조회한다 (임시 계약)
      responses:
        '200':
          description: 세션 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/production/work-orders:
    get:
      tags: [production]
      operationId: listWorkOrders
      summary: 작업지시 목록을 cursor로 조회한다
      description: 권한 `Production.WorkOrder.Read`. `plantId`는 필수이며 `allowedPlantIds`에 없으면 403이다.
      parameters:
        - $ref: '#/components/parameters/PlantId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: sort
          in: query
          description: |
            정렬 키. `field`는 오름차순, `-field`는 내림차순. 허용 값: `plannedStartAt`, `workOrderNumber`, `status`, `priority`.
            고유 키 `workOrderId`가 항상 마지막 tie-breaker로 붙으며 방향은 주 정렬 키와 같다(`-plannedStartAt`이면 `workOrderId` 내림차순).
            `plannedStartAt`과 `priority`는 null일 수 있고 null은 가장 작은 값이다. 기본값은 `-plannedStartAt`.
            cursor는 정렬 키를 포함하므로 sort가 바뀌면 이전 cursor는 400 `CURSOR_SORT_MISMATCH`로 거부된다.
          schema:
            type: string
            enum: [plannedStartAt, '-plannedStartAt', workOrderNumber, '-workOrderNumber', status, '-status', priority, '-priority']
            default: '-plannedStartAt'
        - name: status
          in: query
          description: 상태 필터(여러 개 가능). 허용 값은 BE-06 확정 전까지 정의하지 않는다.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: workOrderNumberPrefix
          in: query
          description: |
            작업지시번호 **접두 일치**(`LIKE @prefix + '%'`). 부분 일치는 제공하지 않는다(대량 테이블에서 `%q%` 검색이 발생하지 않게 하기 위함).
            `(PlantId, WorkOrderNumber)` index를 사용한다. 대소문자 구분은 DB collation을 따른다.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: lineId
          in: query
          schema:
            type: integer
            format: int32
        - name: productModelId
          in: query
          schema:
            type: integer
            format: int32
        - name: plannedFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: plannedTo
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 작업지시 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/production/work-orders/{workOrderId}:
    get:
      tags: [production]
      operationId: getWorkOrder
      summary: 작업지시 상세를 조회한다
      description: 권한 `Production.WorkOrder.Read`. 행을 선택했을 때만 호출한다.
      parameters:
        - name: workOrderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/PlantId'
      responses:
        '200':
          description: 작업지시 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/monitoring/process-unit-status:
    get:
      tags: [monitoring]
      operationId: listProcessUnitStatus
      summary: 공정 현재 상태(Projection)를 cursor 또는 id 일괄로 조회한다
      description: |
        권한 `Monitoring.ProcessUnitStatus.Read`. `plantId`는 필수이며 `allowedPlantIds`에 없으면 403이다.

        두 가지 방식이 있다.
        - 목록: `cursor`, `limit`, `sort`, 필터로 조회한다.
        - id 일괄 재조회: `ids`를 주면(최대 100개) cursor·limit·sort·필터는 무시되고, 해당 `plantId` 안에서 존재하는 행만 반환한다. `nextCursor`는 null, `hasMore`는 false다.

        각 행의 `projectionVersion`은 Projection 전용 bigint이며 WorkOrder `rowVersion`과 다르다.
        `data.asOf`는 Projection 기준 시각(UTC)이다.
      parameters:
        - $ref: '#/components/parameters/PlantId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: sort
          in: query
          description: |
            허용 값: `lastUpdatedAt`, `lastProcessAt`, `finalResult`. `-` 접두는 내림차순. 고유 키 `processUnitStatusId`가 항상 마지막 tie-breaker이며 방향은 주 정렬 키와 같다.
            `lastProcessAt`과 `finalResult`는 null일 수 있고 null은 가장 작은 값이다. 기본값은 `-lastUpdatedAt`. sort가 바뀌면 이전 cursor는 400 `CURSOR_SORT_MISMATCH`로 거부된다.
          schema:
            type: string
            enum: [lastUpdatedAt, '-lastUpdatedAt', lastProcessAt, '-lastProcessAt', finalResult, '-finalResult']
            default: '-lastUpdatedAt'
        - name: finalResult
          in: query
          description: 최종 결과 필터(여러 개 가능)
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: productionLotId
          in: query
          schema:
            type: integer
            format: int64
        - name: ids
          in: query
          description: id 일괄 재조회. 최대 100개. 지정하면 다른 목록 parameter는 무시된다.
          schema:
            type: array
            maxItems: 100
            items:
              type: integer
              format: int64
          style: form
          explode: false
      responses:
        '200':
          description: 공정 현재 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessUnitStatusListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PlantId:
      name: plantId
      in: query
      required: true
      description: Plant 범위. 숨겨진 헤더가 아니라 명시적 parameter이며 서버가 `allowedPlantIds`와 대조해 검증한다.
      schema:
        type: integer
        format: int32
    Limit:
      name: limit
      in: query
      description: 한 번에 받을 행 수. 서버 상한 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: 서버가 만든 불투명 문자열. 정렬 키를 포함하므로 sort가 바뀌면 버리고 처음부터 조회한다.
      schema:
        type: string
  responses:
    BadRequest:
      description: 요청 형식 오류 또는 검증 오류 (`errors[]`에 필드별 오류). `CURSOR_SORT_MISMATCH` 포함.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: 토큰 없음·만료·무효
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Permission 또는 Plant 범위 부족
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: 대상 없음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ApiMeta:
      type: object
      required: [requestId, operationId]
      properties:
        requestId:
          type: string
        operationId:
          type: string
          nullable: true
          description: 조회 전용 요청에서는 null일 수 있다.
    ProblemFieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
        code:
          type: string
          description: 안정적인 식별자. 화면 문구는 클라이언트가 code와 args로 번역한다.
        args:
          $ref: '#/components/schemas/MessageArgs'
    MessageArgs:
      type: object
      additionalProperties: true
      description: 문구 치환 값
    ProblemDetails:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: 안정적인 MES 오류 코드. 예 `CURSOR_SORT_MISMATCH`
        message:
          type: string
          description: 개발자용 영어 문장. 화면 문구로 쓰지 않는다.
        args:
          $ref: '#/components/schemas/MessageArgs'
        errors:
          type: array
          description: 검증 오류(400, 422)에서만 채운다.
          items:
            $ref: '#/components/schemas/ProblemFieldError'
        traceId:
          type: string
        requestId:
          type: string
        operationId:
          type: string
          nullable: true
    LoginRequest:
      type: object
      required: [userName, password]
      properties:
        userName:
          type: string
        password:
          type: string
          format: password
    LoginData:
      type: object
      required: [accessToken, tokenType, expiresInSeconds]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresInSeconds:
          type: integer
    LoginResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/LoginData'
        meta:
          $ref: '#/components/schemas/ApiMeta'
    SessionData:
      type: object
      required: [userId, userName, displayName, allowedPlantIds, capabilities]
      properties:
        userId:
          type: integer
          format: int64
        userName:
          type: string
        displayName:
          type: string
          nullable: true
        allowedPlantIds:
          type: array
          items:
            type: integer
            format: int32
        capabilities:
          type: array
          description: Permission Code 목록. 예 `Production.WorkOrder.Read`
          items:
            type: string
    SessionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/SessionData'
        meta:
          $ref: '#/components/schemas/ApiMeta'
    WorkOrderSummary:
      type: object
      required:
        - workOrderId
        - workOrderNumber
        - plantId
        - lineName
        - productModelName
        - status
        - plannedQuantity
        - completedQuantity
        - goodQuantity
        - defectQuantity
        - priority
        - plannedStartAt
        - plannedEndAt
        - actualStartAt
        - actualEndAt
      properties:
        workOrderId:
          type: integer
          format: int64
          maximum: 9007199254740991
        workOrderNumber:
          type: string
        plantId:
          type: integer
          format: int32
        lineName:
          type: string
          nullable: true
        productModelName:
          type: string
          nullable: true
        status:
          type: string
          description: 상태 문자열. 허용 값과 전이는 BE-06 확정 전까지 정의하지 않는다.
        plannedQuantity:
          type: integer
          format: int64
        completedQuantity:
          type: integer
          format: int64
        goodQuantity:
          type: integer
          format: int64
          description: NOT NULL, 기본값 0
        defectQuantity:
          type: integer
          format: int64
          description: NOT NULL, 기본값 0
        priority:
          type: integer
          nullable: true
        plannedStartAt:
          type: string
          format: date-time
          nullable: true
        plannedEndAt:
          type: string
          format: date-time
          nullable: true
        actualStartAt:
          type: string
          format: date-time
          nullable: true
        actualEndAt:
          type: string
          format: date-time
          nullable: true
    WorkOrderDetail:
      allOf:
        - $ref: '#/components/schemas/WorkOrderSummary'
        - type: object
          required: [productionOrderNumber, productionLotNumber, remark, assignedTo, createdAt, createdBy, rowVersion]
          properties:
            productionOrderNumber:
              type: string
              nullable: true
            productionLotNumber:
              type: string
              nullable: true
            remark:
              type: string
              nullable: true
            assignedTo:
              type: string
              nullable: true
            createdAt:
              type: string
              format: date-time
            createdBy:
              type: string
              nullable: true
            rowVersion:
              type: string
              format: byte
              description: |
                SQL Server `rowversion`(8바이트)의 Base64 직렬화. 불투명 값이며 클라이언트는 해석하거나 비교하지 않고
                Command의 `expectedVersion`에 그대로 되돌려 보낸다. Projection의 `projectionVersion`(int64)과 다르다.
    WorkOrderListData:
      type: object
      required: [items, hasMore, asOf]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/WorkOrderSummary'
        nextCursor:
          type: string
          nullable: true
        hasMore:
          type: boolean
        asOf:
          type: string
          format: date-time
    WorkOrderListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/WorkOrderListData'
        meta:
          $ref: '#/components/schemas/ApiMeta'
    WorkOrderDetailResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/WorkOrderDetail'
        meta:
          $ref: '#/components/schemas/ApiMeta'
    ProcessUnitStatusRow:
      type: object
      description: |
        Projection 행. nullable 필드는 키가 항상 존재한다. `isInProgress`, `isScrapped`, `processSkip`, `scrapCount`는
        DB에서 NOT NULL(기본값 0/false)이므로 null이 오지 않는다. `finalResult`가 null이면 "아직 최종 결과가 정해지지 않음"이다.
      required:
        - processUnitStatusId
        - plantId
        - productionLotId
        - housingQr
        - productModelId
        - lastProcessCode
        - lastProcessAt
        - finalResult
        - isInProgress
        - isScrapped
        - processSkip
        - scrapCount
        - projectionVersion
        - lastUpdatedAt
      properties:
        processUnitStatusId:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        plantId:
          type: integer
          format: int32
        productionLotId:
          type: integer
          format: int64
          maximum: 9007199254740991
        housingQr:
          type: string
        productModelId:
          type: integer
          format: int64
          nullable: true
          maximum: 9007199254740991
        lastProcessCode:
          type: string
          nullable: true
          description: 아직 공정 실적이 없으면 null
        lastProcessAt:
          type: string
          format: date-time
          nullable: true
          description: 아직 공정 실적이 없으면 null
        finalResult:
          type: string
          nullable: true
          description: 최종 결과 문자열. null은 최종 결과 미확정이다. 표시 상태(정상·이상 등)로의 매핑은 프론트 feature가 소유한다.
        isInProgress:
          type: boolean
          description: NOT NULL, 기본값 false
        isScrapped:
          type: boolean
          description: NOT NULL, 기본값 false
        processSkip:
          type: boolean
          description: NOT NULL, 기본값 false
        scrapCount:
          type: integer
          minimum: 0
          description: NOT NULL, 기본값 0
        projectionVersion:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: |
            Projection 전용 bigint(SQL Server `bigint`, `dbo.ProjectionVersionSeq`). API에는 JSON **정수(number)**로 전송한다.
            값은 항상 1 이상 9007199254740991(2^53-1) 이하이며 브라우저 `number` 비교로 정확하다. DB sequence가 이 상한에서
            오류를 내므로(`MAXVALUE 9007199254740991 NO CYCLE`) 상한을 넘는 값은 만들어지지 않는다.
            같은 행에서 갱신마다 증가하고, 클라이언트는 더 큰 값일 때만 행을 교체한다. WorkOrder `rowVersion`(Base64 문자열)과 다르다.
        lastUpdatedAt:
          type: string
          format: date-time
    ProcessUnitStatusListData:
      type: object
      required: [items, hasMore, asOf]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ProcessUnitStatusRow'
        nextCursor:
          type: string
          nullable: true
        hasMore:
          type: boolean
        asOf:
          type: string
