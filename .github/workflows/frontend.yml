name: frontend

on:
  push:
    paths: ['frontend/mes-web/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/mes-web/**', '.github/workflows/frontend.yml']

defaults:
  run:
    working-directory: frontend/mes-web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/mes-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Record bundle size
        run: npm run bundle:size | tee -a "$GITHUB_STEP_SUMMARY"
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/mes-web/playwright-report
